name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Compute BLAKE3 checksum
        run: cargo run --release --version > /dev/null 2>&1; sha256sum target/release/cortex > target/release/cortex.sha256
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            target/release/cortex
            target/release/cortex.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
